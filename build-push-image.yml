steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/gcp-project-506114/gcp-devops-repository/gcp-python-app:v3.0', '.']

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/gcp-project-506114/gcp-devops-repository/gcp-python-app:v3.0']

images: ['asia-south1-docker.pkg.dev/gcp-project-506114/gcp-devops-repository/gcp-python-app:v3.0']

options:
  logging: CLOUD_LOGGING_ONLY
  